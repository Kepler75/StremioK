<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=1920, height=1080, user-scalable=no">
    <title>StremioK</title>
    <link rel="stylesheet" href="css/style.css?v=2.0.0">
</head>
<body>
    <!-- CSS-applied sentinel (kept off-screen); app.js waits for its width before rendering -->
    <div id="css-sentinel" style="position:absolute;left:-9999px;top:0;height:1px;overflow:hidden;"></div>
    <!-- AVPlay video plane (Tizen). Sits behind the UI; shown only during playback. -->
    <object type="application/avplayer" id="av-player"></object>
    <!-- HTML5 fallback for desktop/dev testing when webapis.avplay is absent -->
    <video id="html5-player" playsinline></video>

    <div id="app">
        <div id="screen-home" class="screen"></div>
        <div id="screen-discover" class="screen hidden"></div>
        <div id="screen-detail" class="screen hidden"></div>
        <div id="screen-search" class="screen hidden"></div>
        <div id="screen-settings" class="screen hidden"></div>
        <div id="screen-addaddon" class="screen hidden"></div>
    </div>

    <!-- Subtitle overlay (over the video plane, under the OSD) -->
    <div id="subs" class="hidden"></div>

    <!-- Player OSD overlay (over the video plane) -->
    <div id="player-osd" class="hidden">
        <div id="osd-title"></div>
        <div id="osd-chapter" class="hidden"></div>
        <div id="osd-bar"><div id="osd-progress"></div><div id="osd-sponsor"></div><div id="osd-chapters"></div><div id="osd-buffer"></div><div id="osd-scrub-range" class="hidden"></div><div id="osd-scrub" class="hidden"><div id="osd-scrub-time"></div></div></div>
        <div id="osd-times"><span id="osd-cur">00:00</span><span class="osd-right"><span id="osd-tags"></span><span id="osd-dur">00:00</span></span></div>
        <div id="osd-hint">OK: Play/Pause &nbsp; &larr;/&rarr;: Seek &nbsp; RETURN: Back</div>
    </div>

    <!-- In-player menu (opened with DOWN during playback) -->
    <div id="sub-menu" class="hidden"></div>

    <!-- Contextual quick-action bar (opened with UP during playback) -->
    <div id="player-bar" class="hidden"></div>

    <!-- Skip intro/recap/credits prompt (TheIntroDB) -->
    <div id="skip-prompt" class="hidden"></div>

    <!-- Stream info overlay (player menu → Stream info) -->
    <div id="stream-info" class="hidden"></div>

    <div id="toast" class="hidden"></div>
    <div id="spinner" class="hidden"><div class="spin"></div><div id="spinner-msg"></div></div>

    <!-- Load order matters: polyfills -> util -> iptv -> data -> input -> tvapps -> player parts -> player -> ytplay -> view parts -> views -> app -->
    <!-- ?v= busts the TV webview cache on every release (keep in sync with package.json) -->
    <script src="js/polyfills.js?v=2.0.0"></script>
    <script src="js/util.js?v=2.0.0"></script>
    <script src="js/iptv.js?v=2.0.0"></script>
    <script src="js/youtube.js?v=2.0.0"></script>
    <script src="js/stremio.js?v=2.0.0"></script>
    <script src="js/trakt.js?v=2.0.0"></script>
    <script src="js/keys.js?v=2.0.0"></script>
    <script src="js/focus.js?v=2.0.0"></script>
    <script src="js/tvapps.js?v=2.0.0"></script>
    <script src="js/player-core.js?v=2.0.0"></script>
    <script src="js/player-store.js?v=2.0.0"></script>
    <script src="js/player-lang.js?v=2.0.0"></script>
    <script src="js/player-quality.js?v=2.0.0"></script>
    <script src="js/player-subs.js?v=2.0.0"></script>
    <script src="js/player-audio.js?v=2.0.0"></script>
    <script src="js/player-controls.js?v=2.0.0"></script>
    <script src="js/player.js?v=2.0.0"></script>
    <script src="js/ytplay.js?v=2.0.0"></script>
    <script src="js/local.js?v=2.0.0"></script>
    <script src="js/downloads.js?v=2.0.0"></script>
    <script src="js/stremio-account.js?v=2.0.0"></script>
    <script src="js/view-core.js?v=2.0.0"></script>
    <script src="js/view-home.js?v=2.0.0"></script>
    <script src="js/view-detail.js?v=2.0.0"></script>
    <script src="js/view-search.js?v=2.0.0"></script>
    <script src="js/view-settings.js?v=2.0.0"></script>
    <script src="js/view-discover.js?v=2.0.0"></script>
    <script src="js/views.js?v=2.0.0"></script>
    <script src="js/app.js?v=2.0.0"></script>
    <script src="js/hubpreview.js?v=2.0.0"></script>
</body>
</html>
